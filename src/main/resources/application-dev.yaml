# Configurações do perfil "dev" (carregado junto com application.yaml).
# A conexão com o banco NÃO aparece aqui: o spring-boot-docker-compose lê o compose.yaml,
# sobe o Postgres e configura a conexão sozinho.
spring:
  jpa:
    show-sql: true
  flyway:
    # Em dev, alem das migrations reais, carrega tambem os dados de exemplo (db/seed).
    locations: classpath:db/migration,classpath:db/seed

logging:
  level:
    br.com.brumi: DEBUG
