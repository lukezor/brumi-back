spring:
  application:
    name: brumi-api

  # Perfil usado quando nenhum outro for informado (equivale a "ambiente de desenvolvimento").
  profiles:
    default: dev

  jpa:
    # "validate": o Hibernate apenas confere se as tabelas batem com as entidades.
    # Quem cria/altera tabelas é o Flyway (migrations), nunca o Hibernate.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # Resolve o problema N+1 em listagens: ao carregar as colecoes lazy (categorias, imagens) de uma
        # pagina de produtos, busca ate 50 produtos por consulta (WHERE produto_id IN (...)), em vez de
        # uma consulta por produto.
        default_batch_fetch_size: 50

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100   # size=1000 vira 100: impede que alguem peça a tabela inteira de uma vez

management:
  endpoints:
    web:
      exposure:
        include: health,info
